name: cd-deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write # Required for AWS OIDC federation
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: assisted_reviews
          POSTGRES_USER: review_owner
          POSTGRES_PASSWORD: local_only_change_me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U review_owner -d assisted_reviews"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node & PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Verification Gate
        run: pnpm verify
        env:
          DATABASE_URL: postgresql://review_owner:local_only_change_me@localhost:5432/assisted_reviews

      - name: Run Golden Set Eval Gate
        run: pnpm eval:golden

      - name: Authenticate via AWS OIDC (No Static Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/github-actions-cd-oidc-role
          aws-region: eu-west-1

      - name: Build Bundles
        run: pnpm build

      - name: Deploy & Shift Lambda Aliases
        run: |
          echo "Deploying Lambda packages..."
          # aws lambda update-function-code ...
          # aws lambda update-alias --function-name review-generation-service-student --name live --function-version $NEW_VERSION
          echo "Lambda alias shifted to live version."

      - name: Post-Deploy Smoke Test
        run: |
          echo "Running smoke tests against deployed service endpoints..."
          # curl -f https://<endpoint>/health
          echo "Smoke test passed successfully."
