name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: assisted_reviews
          POSTGRES_USER: review_owner
          POSTGRES_PASSWORD: local_only_change_me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U review_owner -d assisted_reviews"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the locked browser runtime
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --dir packages/db exec prisma migrate deploy --schema prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://review_owner:local_only_change_me@localhost:5432/assisted_reviews
      - run: pnpm verify
        env:
          DATABASE_URL: postgresql://review_owner:local_only_change_me@localhost:5432/assisted_reviews
