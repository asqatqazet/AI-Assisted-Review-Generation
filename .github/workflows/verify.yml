name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: assisted_reviews
          POSTGRES_USER: review_owner
          POSTGRES_PASSWORD: local_only_change_me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U review_owner -d assisted_reviews"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Formatting drift used to surface only during a deploy, several minutes
      # in. `terraform fmt` needs no init and no credentials, so it belongs in
      # the same gate as the rest of the checks.
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the locked browser runtime
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --dir packages/db exec prisma migrate deploy --schema prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://review_owner:local_only_change_me@localhost:5432/assisted_reviews
      - run: pnpm verify
        env:
          DATABASE_URL: postgresql://review_owner:local_only_change_me@localhost:5432/assisted_reviews
